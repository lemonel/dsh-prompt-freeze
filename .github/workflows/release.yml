name: prompt-freeze release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/tools/prompt-freeze-release.mjs validate "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  package:
    name: Build and verify release tarball
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # prepack performs the strict typecheck and builds all runtime entries.
      - run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          node test/tools/prompt-freeze-release.mjs verify "$RELEASE_TAG" "$RUNNER_TEMP/release"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: release
      # Only this job receives write permission. No npm credentials are required.
      - name: Create release with the verified tarball
        shell: bash
        run: |
          set -euo pipefail
          # Refuse publication if someone moved the tag after this run started.
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$actual_sha" != "$RELEASE_SHA" ]]; then
            echo 'Release tag no longer points at the tested commit' >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
